<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo</title>
<style>body{font-family:sans-serif;margin:0;background:#fff}section{min-height:600px;padding:20px}#a{background:#eef;padding:20px}#b{background:#fee;padding:20px}</style></head>
<body><section id="s1"><h1 id="t">Trang thử</h1><div id="a">Khối A</div><input id="r" type="range" min="1" max="10" value="1"><output id="o">1</output></section>
<section id="s2"><div id="b">Khối B</div><button id="btn" onclick="this.textContent='Đã bấm'">Bấm</button></section>
<script>document.getElementById('r').oninput=e=>document.getElementById('o').textContent=e.target.value</script></body></html>
